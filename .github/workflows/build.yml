name: Build Lua Binaries

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install readline dev package
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev

      - name: Build Linux binaries
        run: |
          cd src
          make linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lua-linux
          path: |
            src/lua
            src/luac

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up MinGW
        run: |
          choco install mingw
          echo "C:\tools\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows binaries
        shell: cmd
        run: |
          cd src
          make mingw

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lua-windows
          path: |
            src/lua.exe
            src/luac.exe
