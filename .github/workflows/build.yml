name: Build Lua WASM

on: [push, pull_request]

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v12
        with:
          version: latest # or a specific version like 3.1.55

      - name: Build WASM targets
        shell: bash
        run: |
          source $EMSDK/emsdk_env.sh
          cd src
          make wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lua-wasm
          path: |
            src/lua.js
            src/lua.wasm
            src/luac.js
            src/luac.wasm
            # Add other files if needed, e.g., a test html page later
          if-no-files-found: error # Fail the workflow if no files are found
