name: Build Lua Binaries

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install readline dev package
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev

      - name: Build Linux binaries (static, shared lib, and lua/luac linked with shared lib)
        run: |
          cd src
          make linux MYCFLAGS="-DLUA_USE_LINUX -fPIC" MYLIBS="-Wl,-E -ldl -lreadline -lhistory -lncurses"
          make linux MYCFLAGS="-DLUA_USE_LINUX -fPIC" MYLIBS="-Wl,-E -ldl -lreadline -lhistory -lncurses" LUA_T=lua-static LUAC_T=luac-static MYLDFLAGS="-static" all
          make linux MYCFLAGS="-DLUA_USE_LINUX -fPIC" MYLIBS="-Wl,-E -ldl -lreadline -lhistory -lncurses" so
          make linux MYCFLAGS="-DLUA_USE_LINUX -fPIC" MYLIBS="-Wl,-E -ldl -lreadline -lhistory -lncurses" LUA_T=lua-shared LUAC_T=luac-shared all

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lua-linux
          path: |
            src/lua
            src/luac
            src/lua-static
            src/luac-static
            src/liblua.so
            src/lua-shared
            src/luac-shared

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up MinGW
        run: |
          choco install mingw
          echo "C:\tools\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows binaries
        shell: cmd
        run: |
          cd src
          make mingw

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lua-windows
          path: |
            src/lua.exe
            src/luac.exe
