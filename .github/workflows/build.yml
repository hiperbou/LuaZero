name: Build Lua Binaries

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install readline dev package
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev

      - name: Build Linux binaries (static, shared lib, and lua/luac linked with shared lib)
        run: |
          cd src
          # Default build (dynamic system libs, liblua.a with fPIC objects, lua, luac)
          # The 'linux' target in Makefile sets its own MYCFLAGS and MYLIBS. We add -fPIC to CFLAGS.
          make linux CFLAGS="$(CFLAGS) -fPIC"
          # Static build (lua-static, luac-static using liblua.a from above)
          # The 'linux-static' target in Makefile sets necessary CFLAGS, MYLDFLAGS, and MYLIBS.
          make linux-static
          # Shared library liblua.so (uses fPIC objects from liblua.a or rebuilds .so.o)
          # We ensure -fPIC is used for objects that go into .so.
          make linux CFLAGS="$(CFLAGS) -fPIC" so
          # Binaries linked against liblua.so
          make linux CFLAGS="$(CFLAGS) -fPIC" LUA_T=lua-shared LUAC_T=luac-shared all

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lua-linux
          path: |
            src/lua
            src/luac
            src/lua-static
            src/luac-static
            src/liblua.so
            src/lua-shared
            src/luac-shared

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up MinGW
        run: |
          choco install mingw
          echo "C:\tools\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows binaries (Shared DLL and Static)
        shell: cmd
        run: |
          cd src
          make mingw
          make mingw-static

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lua-windows
          path: |
            src/lua.exe
            src/luac.exe
            src/lua51.dll
            src/lua-static.exe
            src/luac-static.exe
            src/liblua.a
